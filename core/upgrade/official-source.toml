schema_version = 2
source_id = "ai-carry-official-public"
product_id = "ai-carry"
label = "AI Carry 官方公开发布源"
repository = "https://github.com/Ww-Cooooo/AI-Carry"
releases = "https://github.com/Ww-Cooooo/AI-Carry/releases"
latest_release = "https://github.com/Ww-Cooooo/AI-Carry/releases/latest"
latest_archive = "https://github.com/Ww-Cooooo/AI-Carry/archive/refs/heads/main.zip"
latest_archive_kind = "github-generated-public-main-source-archive"
versioned_archive_template = "https://github.com/Ww-Cooooo/AI-Carry/archive/refs/tags/{tag}.zip"
installation_guide = "https://github.com/Ww-Cooooo/AI-Carry/blob/main/INSTALL.md"

[identity_compatibility]
legacy_source_ids = ["agent-carry-official-public"]
legacy_product_ids = ["agent-carry"]
legacy_repositories = ["https://github.com/Ww-Cooooo/Agent-Carry"]
repository_slug_state = "current-ai-carry-slug-with-legacy-github-redirect"
repository_rename = "completed-with-compatible-old-repository-read-and-new-output-write"

[behavior]
check = "only-after-explicit-user-request"
background_check = false
automatic_download = false
automatic_upgrade = false
github_account_required = false
network_unavailable = "ask-for-a-user-provided-local-archive-and-do-not-broadly-search-for-mirrors"
alternate_source = "label-as-nonofficial-and-require-user-choice-before-reading-or-downloading"

[verification]
release_kind = "published-non-draft-non-prerelease"
required_inputs = ["target-release-manifest", "candidate-file-manifest-or-hashes"]
archive_selection = "default-to-the-latest-formal-release-tag; when-the-user-explicitly-selects-another-formal-version-use-its-fixed-tag-archive; use-latest_archive-only-for-a-verified-latest-release-when-public-main-equals-that-tag"
branch_archive_invariant = "publication-only: public-main-must-equal-latest-published-release-tag-before-a-release-is-complete; historical-fixed-releases-remain-valid-after-main-moves"
archive_root = "discover-project-root-by-required-files-and-ignore-one-github-generated-outer-directory"
archive_integrity = "verify-extracted-file-set-and-file-bytes-against-the-approved-release-content-manifest; outer-zip-sha256-is-observational-only"
checks = ["source-identity", "published-release-and-fixed-tag-commit", "version-and-schema", "path-safety", "extracted-file-integrity", "upgrade-preview-before-write"]
claim_limit = "integrity-and-source-checks-reduce-risk-but-do-not-promise-absolute-safety"
