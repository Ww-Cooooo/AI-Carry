schema_version = 1
map_id = "domain-lifecycle"

[[routes]]
id = "first-run-guidance"
summary = "空白模板安装后立即迎接用户，同时说明看板与聊天入口、三种交流路线和下一步；只收集创建所需的第一批选择，不写入或锁定实例。"
triggers = ["安装完成后的首次设置", "安装后第一条回复", "创建我的助手", "创建我的助手入口", "说明三种引导路线", "首次选择交流方式", "选择通用或领域", "先帮我判断", "开始实例化"]
target = "core/guides/instantiation-guide.md"
state = "active"
minimum_level = 1
confirmation = "none"

[[routes]]
id = "instantiation"
summary = "在首次引导取得用户选择后，先阻止模板态提前执行首项任务，再完成渐进访谈、执行器完整预览和三文件核心创建；模型等级只在出现真实复杂架构权衡时提供建议，不能阻断普通首次创建。"
triggers = ["已完成交流方式与助手方向两项首次选择", "先帮我判断后确认正式方向", "模板态准备开始首项任务", "开始渐进访谈", "实例结构设计", "生成完整预览", "确认完整预览后创建", "写入实例", "锁定助手方向", "实例化写入检查"]
target = "core/guides/first-use-execution-gates.md"
state = "active"
minimum_level = 1
confirmation = "explicit-complete-preview-before-write"

[[routes]]
id = "guidance-mode"
summary = "调整当前 Agent 的解释深度、提问方式和协作节奏，不改变已锁定的助手方向。"
triggers = ["调整交流方式", "调整引导方式", "讲详细一点", "少解释直接做", "改成一步步引导"]
target = "core/guides/instantiation-guide.md"
state = "active"
minimum_level = 1
confirmation = "before-write"

[[routes]]
id = "user-decision-guidance"
summary = "当用户需要作出多步骤、技术性、风险性、长期性选择，表示不知道怎样选，或明确询问任务结束后做什么时，用普通语言解释背景，给出有依据的推荐、必要选项和明确下一步。"
triggers = ["需要用户选择", "用户不确定", "不知道怎么选", "小白引导", "解释选项与后果", "长期文件怎样保存", "任务产出文件去向", "最后告诉我下一步", "接下来做什么"]
target = "core/protocols/USER_GUIDANCE.md"
state = "on-demand-for-nontrivial-user-decision"
minimum_level = 1
confirmation = "none-the-protocol-prepares-the-real-choice"

[[routes]]
id = "task-closeout-guidance"
summary = "保存或更新后续任务资料时按 USER_GUIDANCE 4.1 接通现有入口；复杂任务交付时再检查回执、文件去向和总体下一步。收尾文字检查不能证明资料可达或 Agent 续做正确。"
triggers = ["保存以后继续使用的任务资料", "更新持续任务资料", "复杂任务准备交付", "上下文压缩后准备交付", "续接任务准备收尾", "实际使用长期内容后交付", "出现学习价值后交付", "用户可见文件交付", "检查最终回复收尾"]
target = "core/protocols/USER_GUIDANCE.md"
state = "on-demand-before-complex-task-closeout"
minimum_level = 1
confirmation = "none-local-check-never-executes-the-task"

[[routes]]
id = "preference-reuse"
summary = "从已有实例安全复用个人偏好，不复制领域身份和任务资产。"
triggers = ["复用偏好", "从另一个实例复制习惯"]
target = "core/guides/preference-reuse-guide.md"
state = "active"
minimum_level = 1
confirmation = "before-write"

[[routes]]
id = "identity-inspection"
summary = "只读取实例清单，解释当前方向、锁定状态和边界。"
triggers = ["我是什么实例", "查看实例方向", "是否锁定"]
target = "instance/manifest.toml"
state = "active"
minimum_level = 1
confirmation = "none"
