schema_version = 1
registry_id = "global-trigger-governance"
purpose = "Record only cross-cutting, persistent, scheduled, recovery or safety triggers; ordinary requests stay single-source in their category maps."
ordinary_startup = "never-load"
startup_projection = "instance/maps/signal-map.toml"
maintenance_rule = "Add a rule only when a category map cannot own the behavior by itself."

[[classes]]
id = "action-gate"
summary = "Check a consequential action immediately before its effect."
persistent = false
evaluation = "before-action"
startup_policy = "project-only-if-left-unresolved"

[[classes]]
id = "cross-session-count"
summary = "Accumulate bounded evidence across tasks without loading the evidence at startup."
persistent = true
evaluation = "when-a-matching-event-occurs"
startup_policy = "project-only-when-actionable"

[[classes]]
id = "scheduled-time"
summary = "Wake a durable item no earlier than its next eligible time."
persistent = true
evaluation = "compare-against-capsule-earliest-time"
startup_policy = "aggregate-earliest-time-and-count-only"

[[classes]]
id = "metric-health"
summary = "Update a small metric only while its related operation already runs."
persistent = true
evaluation = "at-related-operation"
startup_policy = "project-only-after-threshold-or-uncertainty"

[[classes]]
id = "validity-on-use"
summary = "Check an environment or dependency when the related capability is used."
persistent = false
evaluation = "on-use-or-explicit-refresh"
startup_policy = "project-only-if-unresolved"

[[classes]]
id = "transaction-recovery"
summary = "Recover an interrupted coupled write before another write touches the same truth."
persistent = true
evaluation = "before-overlapping-write"
startup_policy = "control-fields-only"

[[classes]]
id = "consumer-local"
summary = "A rebuildable consumer owns its own freshness and local failure."
persistent = false
evaluation = "inside-the-consumer"
startup_policy = "never-project"

