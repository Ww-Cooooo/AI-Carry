schema_version = 1
map_id = "local-operations"

[[routes]]
id = "agent-guided-installation"
summary = "从 GitHub 链接或完整压缩包安装 AI Carry，在稳定本地目录保留完整项目，创建网页版与客户端两个桌面入口，并把空白模板连续交给首次创建引导。"
triggers = ["安装AI Carry", "从GitHub链接安装", "从压缩包安装", "创建桌面看板入口", "打开客户端", "安装客户端", "修复两个桌面入口", "修复看板快捷方式", "安装后继续创建助手"]
target = "INSTALL.md"
state = "active"
minimum_level = 1
confirmation = "before-ambiguous-overwrite-existing-instance-or-meaningful-location-conflict"

[[routes]]
id = "host-session-resume"
summary = "已实例化助手进入新会话时，只用极小宿主索引和一个档案恢复接入；状态异常才展开完整协议。"
triggers = ["新会话恢复", "当前会话没有接入回执", "继续使用已接入宿主"]
target = "core/protocols/HOST_SESSION_RESUME.md"
state = "active-after-instantiation"
minimum_level = 1
confirmation = "none-unless-full-handshake-reaches-a-gate"

[[routes]]
id = "upgrade-session-activation"
summary = "升级文件切换后优先让当前长期对话在安全节点自动接续新版规则并完成轻量行为验收；宿主限制只局部影响接续，新任务是最后兼容路线。"
triggers = ["升级后会话激活", "长期对话发现版本变化", "升级后自动接续新版", "继续完成升级验收", "文件已升级但行为没生效", "新会话验证新版", "升级后重新接入"]
target = "core/protocols/UPGRADE_SESSION_ACTIVATION.md"
state = "on-demand-after-version-switch-version-receipt-mismatch-or-explicit-resume"
minimum_level = 1
confirmation = "none-for-read-only-activation-check-existing-upgrade-authorization-does-not-expand"

[[routes]]
id = "host-integration"
summary = "用平台无关提示词接入、恢复或更换宿主，开放式发现能力，渐进迁移宿主协作记忆，并在使用时复核宿主执行经验。"
triggers = ["接入AI Carry", "连接宿主", "换Agent", "恢复接入", "能力发现", "宿主记忆迁移", "宿主执行经验失效", "任务回传"]
target = "core/protocols/HOST_INTEGRATION.md"
state = "active"
minimum_level = 1
confirmation = "before-new-permission-sensitive-transfer-or-high-impact-write-asset-learning-is-risk-tiered"

[[routes]]
id = "dashboard-actions"
summary = "解释看板状态、刷新快照或执行看板复制出的 Agent 请求。"
triggers = ["看板", "刷新看板", "复制操作请求"]
target = "core/protocols/DASHBOARD_ACTIONS.md"
state = "active"
minimum_level = 1
confirmation = "per-action"

[[routes]]
id = "problem-report"
summary = "从用户最早觉得不对的一句话、操作或结果开始，在当前对话中有界分析并生成一份自动遮盖敏感信息、不会自动上传的 Markdown 问题报告。"
triggers = ["生成问题报告", "反馈问题", "哪里出问题了", "从哪句话开始不对", "整理错误报告", "把问题发给开发者"]
target = "core/guides/problem-report-guide.md"
state = "on-demand"
minimum_level = 1
confirmation = "the-explicit-report-request-authorizes-local-guidance-and-a-new-local-report-only-any-external-send-needs-a-separate-exact-target"

[[routes]]
id = "privacy-migration"
summary = "登记并核对要随助手携带的本地资料，把不含隐私正文的脱敏安全副本托管到用户自己的 GitHub 私有仓库，或在本地完整导出、导入和迁移已登记／已引用的隐私资料；秘密凭据永不进入模型、Git 或迁移包。"
triggers = ["GitHub私密备份", "Git安全副本", "上传Git", "Git备份", "打包带走", "隐私导出", "隐私导入", "换电脑", "迁移实例", "随助手带走资料", "登记私密资料", "检查迁移范围", "大型视频迁移"]
target = "core/protocols/PRIVACY_IMPORT_EXPORT_SOP.md"
state = "on-demand"
minimum_level = 1
confirmation = "registered-scope-review-and-local-package-are-directly-authorized-new-external-root-private-github-create-or-push-and-conflict-merges-require-explicit-confirmation"

[[routes]]
id = "platform-adaptation"
summary = "宿主或系统已经确定后，重建路径、工具和环境等可删除的轻量适配。"
triggers = ["换电脑", "换系统", "路径变化", "环境适配"]
target = "core/guides/platform-adaptation-guide.md"
state = "on-demand"
minimum_level = 1
confirmation = "before-local-change"

[[routes]]
id = "skill-initialization"
summary = "首次安装时发现并安装所需 Skill，生成小型 Skill 路由。"
triggers = ["安装Skill", "初始化Skill", "刷新Skill地图"]
target = "core/guides/skill-init-guide.md"
state = "on-demand"
minimum_level = 1
confirmation = "before-install"

[[routes]]
id = "skill-workshop"
summary = "推荐只供用户选择。用户明确指定方法后，Agent 在生成前询问一次 ZIP、独立文件夹、链接或本机保留，再只对该方法复制出的唯一可编辑真源自动脱敏、通用化、写入稳定共享身份与版本、检查并生成真实交付载体；原方法不变。旧导出无需预迁移，第一次相关动作再补选方式。别人分享的文件夹、ZIP 或链接统一由确定性入口先隔离只读审查；能证明同一身份的更高版本展示逐路径升级预览并保留旧版前像，其他冲突局部复核。"
triggers = ["Skill工坊", "把SOP转成Skill", "把这个方法转成Skill", "分享这个流程", "导出为Skill", "把Skill打成ZIP", "生成Skill文件夹", "用链接分享Skill", "继续检查这个Skill", "准备分享这个Skill", "重新导出这个Skill", "这个Skill为什么需要复核", "安装别人分享的Skill", "导入Skill", "升级Skill", "更新别人分享的Skill", "检查Skill压缩包", "从链接安装Skill", "判断这个Skill能不能装"]
target = "core/guides/skill-workshop-guide.md"
state = "on-demand"
minimum_level = 1
confirmation = "local-draft-and-bounded-review-can-follow-the-explicit-request-any-review-chosen-modification-sharing-or-installation-needs-the-relevant-current-authorization"
