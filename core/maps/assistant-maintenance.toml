schema_version = 1
map_id = "assistant-maintenance"

[[routes]]
id = "product-identity"
summary = "看到 Agent Carry 旧名时先按已登记兼容身份继续；只有当前产品自有输出仍写旧身份、名称证据冲突或明确审查改名时，才加载产品身份协议并局部修正，不因单个旧名让整个 Agent 停止。"
triggers = ["产品改名", "Agent Carry 旧名", "AI Carry 名称冲突", "旧品牌残留", "仓库名没改", "新输出仍写旧名"]
target = "core/protocols/PRODUCT_IDENTITY.md"
state = "on-demand"
minimum_level = 1
confirmation = "none"

[[routes]]
id = "component-change"
summary = "正式新增、修改、删除、重命名、移动、迁移、升级或发布前，先读取共同质量原则；协议再按目标类型与风险决定模型等级，稳定低风险实例资产不会因此一律要求 Level 3。"
triggers = ["修改助手", "修改正式内容", "新增功能", "删除功能", "移动文件", "重命名组件", "迁移正式内容", "准备升级", "准备发布"]
target = "core/protocols/COMPONENT_CHANGE.md"
state = "maintenance-only"
minimum_level = 1
confirmation = "target-and-risk-dependent-before-durable-change"

[[routes]]
id = "territory-terminology"
summary = "新增、翻译、审查或发布涉及国家、地区、行政区划、地图和旗帜的 AI Carry 自有内容时，使用固定中英文称谓并保护用户原文。"
triggers = ["地域称谓", "中国台湾", "中国香港", "中国澳门", "中英文地区名称", "国家和地区选择器", "地图", "旗帜", "版图表达"]
target = "core/protocols/TERRITORY_TERMINOLOGY.md"
state = "maintenance-only"
minimum_level = 3
confirmation = "before-map-flag-or-public-content-change"

[[routes]]
id = "template-upgrade"
summary = "把模板更新安全应用到实例时，同时加载实例持续变化兼容协定；由实例 Agent 保留、适配、重连、重建或局部隔离自己的内容，文件切换后再完成真实行为验收。"
triggers = ["升级模板", "导入升级包", "检查新版本", "检查更新", "官方新版本"]
target = "core/guides/upgrade-guide.md"
state = "on-demand"
minimum_level = 3
confirmation = "before-upgrade"

[[routes]]
id = "instance-evolution-compatibility"
summary = "实例安装、学习、进化或其他正式持久变化按实际影响自动命中，不依赖用户说出协定名；只核对所有权、以后升级方式和局部回退，可确定差异自动修复，单项故障局部隔离并自然语言汇报，普通使用不加载且不增加一轮确认。"
triggers = ["实例持久变更", "安装软件", "更新软件", "删除软件", "安装模型", "更新模型", "删除模型", "安装Skill", "更新Skill", "删除Skill", "安装插件", "更新插件", "删除插件", "安装适配器", "更新适配器", "删除适配器", "新增独立功能", "更新独立功能", "删除独立功能", "实例组件", "组件纳管", "自我学习形成资产", "自我进化形成资产", "旧实例纳管", "实例升级兼容"]
target = "core/protocols/INSTANCE_EVOLUTION_COMPATIBILITY.md"
state = "on-demand-before-and-after-durable-instance-change"
minimum_level = 1
confirmation = "reuse-current-action-authorization-no-extra-compatibility-confirmation"

[[routes]]
id = "professional-extension-contract"
summary = "为真实专业工作区登记稳定所有权、可携带与派生边界；没有专业工作区的实例不创建，也不在启动时扫描。"
triggers = ["创建专业扩展", "登记专业工作区", "工作区所有权", "复杂实例升级", "工作区迁移", "本地网页写入"]
target = "core/schemas/extension-manifest.schema.md"
state = "maintenance-only"
minimum_level = 3
confirmation = "before-claiming-an-existing-workspace-or-changing-its-ownership"

[[routes]]
id = "task-orchestration"
summary = "仅在确实需要跨 Agent 交接时传递最小任务包；当前 Agent 能完成就直接完成，模型等级不代替事实或授权。"
triggers = ["跨Agent执行", "交给另一个 Agent", "独立子任务", "Level 3规划", "交给Level 1执行"]
target = "core/protocols/TASK_ORCHESTRATION_SOP.md"
state = "on-demand"
minimum_level = 1
confirmation = "execution-mode-choice"

[[routes]]
id = "component-registry"
summary = "查看组件所有者、依赖、对外入口和变更联动。"
triggers = ["组件地图", "一致性检查", "影响分析"]
target = "core/maps/component-map.toml"
state = "maintenance-only"
minimum_level = 2
confirmation = "none"

[[routes]]
id = "trigger-governance"
summary = "统一检查时间、次数、风险、规模、状态、版本和恢复类触发，避免继续扩张启动上下文。"
triggers = ["触发规则", "达到条件后", "定时提醒", "阈值治理", "启动胶囊膨胀", "触发系统整体检查"]
target = "core/protocols/CROSS_SESSION_SIGNALS.md"
state = "maintenance-only"
minimum_level = 3
confirmation = "none"

[[routes]]
id = "validation-evidence-maintenance"
summary = "只在写入或重建结果验证索引时发现容量达到 80% 后，整理被更强证据替代的旧成功记录；未解决失败不能隐藏。"
triggers = ["结果验证索引接近容量", "验证证据达到 80%", "整理成熟度证据", "validation evidence capacity"]
target = "core/schemas/result-validation-evidence-index.schema.md"
state = "maintenance-only"
minimum_level = 3
confirmation = "before-removing-validation-evidence"

[[routes]]
id = "governance-memory-research"
summary = "周期性联网研究新的 Agent 记忆治理技术，并评估是否值得改进本助手。"
triggers = ["运行记忆治理长期TODO", "研究新的记忆技术", "用户主动提出记忆新技术并要求研究"]
target = "instance/governance/memory-governance-card.md"
state = "explicit-only-no-background"
minimum_level = 3
confirmation = "explicit"

[[routes]]
id = "governance-consistency-research"
summary = "研究能改进组件一致性与变更联动体系的新方法。"
triggers = ["运行一致性治理长期TODO", "改进变更联动体系"]
target = "instance/governance/consistency-governance-card.md"
state = "explicit-only-no-background"
minimum_level = 3
confirmation = "explicit"

[[routes]]
id = "governance-security-research"
summary = "研究新的提示词注入、Agent 攻击和外部内容安全防御。"
triggers = ["运行安全治理长期TODO", "研究新的Agent攻击", "用户主动提出安全新技术并要求研究"]
target = "instance/governance/network-security-governance-card.md"
state = "explicit-only-no-background"
minimum_level = 3
confirmation = "explicit"
